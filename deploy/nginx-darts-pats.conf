server {
    listen 80;
    server_name localhost;

    root /path/to/darts-pats-static-site;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /data/ {
        try_files $uri =404;
    }

    location /_astro/ {
        try_files $uri =404;
    }
}
